requested_locomotion_mode: walking  # requested startup mode: walking / standing / interactive

timing:
  cycle: 0.5
  swing: 0.2
  stance: 0.3
  horizon: 0.5
  horizon_steps: 25

model:
  # xml_path: models/tron/biped_design.xml
  # auxiliary_xml_path: models/tron/biped_design.xml
  xml_path: xml-builder/design.xml
  auxiliary_xml_path: xml-builder/design.xml
  foot_end_effector_source: site  # site or collision_geom_center
  gravity: -9.81

mpc:
  friction_coefficient: 0.6
  foot_half_length: 0.09
  foot_half_width: 0.03
  torsional_friction_scale: 0.03
  normal_force_max: 600.0
  normal_force_min: 5.0
  use_shifted_warm_start: true
  iterations_between_solve: 7
  walking:
    contact_wrench_model: full_wrench  # full_wrench or no_roll_moment
    #                    roll   pitch  yaw    px     py     pz      omega_x  omega_y  omega_z  vx     vy     vz    g
    state_weight_diag: [30000,  6000,  400,   150000,  700000,  90000,     10,     10,     10,     80,    60,    10,   1 ]
    #                    Fx_L    Fy_L    Fz_L    Fx_R    Fy_R    Fz_R    Mx_L    My_L    Mz_L    Mx_R    My_R    Mz_R
    input_weight_diag: [1.0e-3, 1.0e-3, 1.0e-3, 1.0e-3, 1.0e-3, 1.0e-3, 1.0e-3, 1.0e-3, 1.0e-3, 1.0e-3, 1.0e-3, 1.0e-3]
  standing:
    contact_wrench_model: full_wrench  # full_wrench or no_roll_moment
    # Keep the same baseline for now; tune this separately from walking later.
    #                    roll   pitch  yaw    px     py     pz      omega_x  omega_y  omega_z  vx     vy     vz    g
    state_weight_diag: [30000,  60000,   400,    30000,  60000,  30000,      10,     10,     10,     10,    10,    5,   1 ]
    #                    Fx_L    Fy_L    Fz_L    Fx_R    Fy_R    Fz_R    Mx_L    My_L    Mz_L    Mx_R    My_R    Mz_R
    input_weight_diag: [1.0e-4, 1.0e-4, 1.0e-4, 1.0e-4, 1.0e-4, 1.0e-4, 1.0e-4, 1.0e-4, 1.0e-4, 1.0e-4, 1.0e-4, 1.0e-4]

swing:
  natural_frequency: [120.0, 120.0, 90.0]
  kd_diag: [20.0, 20.0, 20.0]
  height: 0.05
  min_remaining_time: 0.001
  body_velocity_half_stance_offset: 0.25
  mid_speed_body_velocity_half_stance_offset: 0.20
  body_velocity_half_stance_offset_switch_speed: 0.45
  high_speed_body_velocity_half_stance_offset: 0.18
  high_speed_body_velocity_half_stance_offset_switch_speed: 0.55
  swing_foot_yaw_lead_scale: 0.0
  enable_stance_foot_yaw_hold: false
  turn_tangential_lead_scale: 0.0
  nominal_foot_offsets_B:
    - [0.0, 0.0817, 0.0]
    - [0.0, -0.0817, 0.0]
  stop_capture_point_gain: 0.2
  stop_capture_point_max_offset: 0.08
  stop_velocity_deadband: 0.02
  stop_braking_latch_clear_ticks: 5
  # TRON1 biped has no hip-yaw or ankle-yaw joint, so swing roll/yaw moment control stays disabled.
  roll_kp: 0.0
  roll_kd: 0.0
  pitch_kp: 40.0
  pitch_kd: 3.0
  yaw_kp: 0.0
  yaw_kd: 0.0
  stance_yaw_kp: 0.0
  stance_yaw_kd: 0.0

user_command_filter:
  x_dot_tau: 0.5
  y_dot_tau: 0.5
  psi_dot_tau: 0.5
  standing_roll_offset_tau: 0.5
  standing_pitch_offset_tau: 0.5
  x_dot_max: 3.0
  y_dot_max: 3.0
  psi_dot_max: 1.0

reference_trajectory:
  # single_support: legacy behavior, double_support: only when both feet are stance, always: integrate every step
  yaw_integration_mode: always

contact_manager:
  contact_force_on_threshold: 20.0
  contact_force_off_threshold: 0.3
  contact_on_confirm_ticks: 1
  contact_off_confirm_ticks: 4
  contact_ramp_duration: 0.01
  contact_lock_steps: 1
  late_contact_timeout: 0.20
  ground_search_velocity: 0.40
  ground_search_max_depth: 0.15
  ground_search_tracking_time: 0.08
  stance_contact_loss_foot_height: 0.050
  enable_early_contact_handling: true
  enable_late_contact_handling: false

logging:
  standing_mpc_debug_trigger_times: []

startup:
  # If requested_locomotion_mode is walking, hold standing MPC this long after leg PD init before gait starts.
  post_init_standing_settle_time: 1.0

locomotion_transition:
  braking_settle_speed_threshold: 0.01
  braking_settle_yaw_rate_threshold: 0.01
  braking_settle_average_window: 1.0
  braking_settle_hold_ticks: 3
  braking_timeout_seconds: 3.0
  braking_touchdown_count: 5

joint_tracking:
  leg:
    # TRON1 leg order: [abad, hip, knee, ankle]. This robot's open-loop leg
    # PD phase has no torso-balance feedback (pure joint-space PD), so it
    # only stays upright if the gains are stiff enough to hold static
    # standing torque -- verified against actuatorfrcrange caps (80/80/80/20
    # Nm) with a standalone mj_step harness; kp below ~500 on hip/knee lets
    # the crouch topple within ~0.5s even with the pose statically balanced.
    kp: [600.0, 900.0, 900.0, 240.0]
    kd: [40.0, 60.0, 60.0, 16.0]

initial_pose:
  # Floating-base pose from the model keyframe. Used once to seed the reduced-body target.
  base_position_W: [0.0, 0.0, 0.76]
  base_rpy_W: [0.0, 0.0, 0.0]
  leg_initialization_time: 1.0
  arm_initialization_time: 1.0
  # TRON1 leg order: [abad, hip, knee, ankle]. A small knee/ankle-only bend
  # (near-straight leg) for compliance -- larger crouches (bigger hip/ankle
  # bend) demand more static holding torque than the real actuator limits
  # allow and topple regardless of gain; this shallow crouch stays well
  # inside the torque budget and is verified stable open-loop for 5s.
  leg_joint_offsets: [0.0, 0.0, 0.15, -0.08]

gait_swing_hold_test:
  xml_path: models/tron/biped.xml
  keyframe_name: home
